[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dhrona"
dynamic = ["version"]
description = "train agents to choose and use the right tools"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["fastcore>=2.1.16", "aidialog>=0.0.22", "uraiyadal>=0.0.1", "llmsurgery>=0.0.13"]

[project.scripts]
dhrona = "dhrona.core:main"
dhrona-capture = "dhrona.rounds:capture_cli"
dhrona-accept = "dhrona.rounds:accept_cli"
dhrona-start = "dhrona.rounds:start_cli"
dhrona-import = "dhrona.sessions:import_cli"
dhrona-export = "dhrona.sessions:export_cli"
dhrona-tools = "dhrona.tools:tools_cli"

[project.urls]
Repository = "https://github.com/Karthik777/drona"
Documentation = "https://Karthik777.github.io/drona/"

[project.entry-points.nbdev]
dhrona = "dhrona._modidx:d"

[tool.hatch.build.targets.wheel]
packages = ["dhrona"]

[tool.hatch.build.targets.sdist]
include = ["/dhrona", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "dhrona/__init__.py"

[dependency-groups]
dev = [
    "koshas>=0.1.7",
    "nbdev>=3.3.11",
    "notebook>=7.6.1",
    "pytest>=8.0.0",
]

[tool.nbdev]
