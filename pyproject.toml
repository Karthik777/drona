[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drona"
dynamic = ["version"]
description = "train agents to choose and use the right tools"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["fastcore>=2.1.16", "uraiyadal>=0.0.1"]

[project.scripts]
drona = "drona.core:main"

[project.urls]
Repository = "https://github.com/Karthik777/drona"
Documentation = "https://Karthik777.github.io/drona/"

[project.entry-points.nbdev]
drona = "drona._modidx:d"

[tool.hatch.build.targets.wheel]
packages = ["drona"]

[tool.hatch.build.targets.sdist]
include = ["/drona", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "drona/__init__.py"

[dependency-groups]
dev = ["nbdev>=3.3.11", "notebook>=7.6.1", "pytest>=8.0.0"]

[tool.nbdev]
